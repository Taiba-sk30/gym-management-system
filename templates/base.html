<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gym Management System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fontawesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>

        /* =========================
            GLOBAL THEME
        ========================== */

        body{
            background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        /* =========================
            SIDEBAR
        ========================== */

        .sidebar{
            height:100vh;
            background:#111;
            padding-top:25px;
            position:fixed;
            width:240px;
        }

        .sidebar h4{
            text-align:center;
            margin-bottom:25px;
            color:#ff4d4d;
            font-weight:bold;
        }

        .sidebar a{
            display:block;
            color:#bbb;
            padding:12px 20px;
            text-decoration:none;
            transition:.3s;
            border-radius:8px;
            margin:6px 10px;
        }

        .sidebar a:hover{
            background:#ff4d4d;
            color:white;
            transform:translateX(5px);
        }

        /* =========================
            MAIN CONTENT
        ========================== */

        .content{
            margin-left:250px;
            padding:30px;
        }

        /* =========================
            CARDS STYLE
        ========================== */

        .card{
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border:none;
            border-radius:18px;
            box-shadow:0 0 25px rgba(0,0,0,.4);
            color:white;
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        /* =========================
            TABLE
        ========================== */

        table{
            color:white !important;
        }

        .table thead{
            background:#ff4d4d;
        }

        /* =========================
            BUTTONS
        ========================== */

        .btn-primary{
            background:#ff4d4d;
            border:none;
        }

        .btn-primary:hover{
            background:#ff1a1a;
        }

        /* =========================
            HEADINGS
        ========================== */

        h2,h5{
            font-weight:600;
        }

    </style>
</head>


<body>

<!-- Sidebar -->
<div class="sidebar">

    <h4><i class="fa-solid fa-dumbbell"></i> GYM</h4>

    <a href="/dashboard"><i class="fa-solid fa-house"></i> Dashboard</a>
    <a href="/trainer"><i class="fa-solid fa-user-tie"></i> Trainers</a>
    <a href="/trainee"><i class="fa-solid fa-users"></i> Trainees</a>
    <a href="/attendance"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
    <a href="/payments"><i class="fa-solid fa-money-bill"></i> Payments</a>
    <a href="/reports"><i class="fa-solid fa-chart-line"></i> Reports</a>
    <a href="/enquiry"><i class="fa-solid fa-comments"></i> Enquiry</a>
    <a href="/logout" class="text-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>

</div>


<!-- Content -->
<div class="content">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
