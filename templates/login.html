<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gym Management Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fontawesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            height:100vh;
            font-family:'Segoe UI',sans-serif;
            overflow:hidden;
        }

        .left{
            background:url("{{ url_for('static', filename='images/img_logo.jpeg') }}") left/cover;
            position:relative;
        }

        .left::after{
            content:"";
            position:absolute;
            inset:0;
            background:rgba(0,0,0,0.6);
        }

        .brand-text{
            position:absolute;
            bottom:40px;
            left:40px;
            color:white;
            z-index:2;
        }

        .right{
            background:linear-gradient(135deg,#121212,#1f1f1f);
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:360px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            color:white;
            box-shadow:0 0 35px rgba(0,0,0,0.6);
            animation:slideUp .7s ease;
        }

        @keyframes slideUp{
            from{opacity:0; transform:translateY(40px);}
            to{opacity:1; transform:translateY(0);}
        }

        .form-control{
            background:#2c2c2c;
            border:none;
            color:white;
        }

        .form-control:focus{
            background:#333;
            color:white;
            box-shadow:none;
        }

        .btn-login{
            background:#ff3c3c;
            border:none;
            transition:.3s;
        }

        .btn-login:hover{
            transform:scale(1.05);
            background:#ff1a1a;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            text-align:center;
            margin-bottom:20px;
        }

    </style>
</head>

<body>

<div class="container-fluid h-100">
    <div class="row h-100">

        <!-- LEFT IMAGE -->
        <div class="col-md-7 d-none d-md-block left">
            <div class="brand-text">
                <h2><i class="fa-solid fa-dumbbell"></i> Bilzz Fitnesss World</h2>
                <p>Train • Nourish • Transform</p>
            </div>
        </div>


        <!-- RIGHT LOGIN -->
        <div class="col-md-5 right">

            <div class="login-card">

                <div class="logo">
                    <i class="fa-solid fa-dumbbell text-danger"></i>
                    Admin Login
                </div>

                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="alert alert-danger text-center">
                    {{ messages[0] }}
                </div>
                   {% endif %}
                {% endwith %}


                <form method="POST" action="{{ url_for('login') }}">


                    <div class="mb-3">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3 position-relative">
                        <label>Password</label>
                        <input type="password" id="pass" name="password" class="form-control" required>

                        <i class="fa-solid fa-eye position-absolute"
                           style="right:15px; top:42px; cursor:pointer;"
                           onclick="togglePass()"></i>
                    </div>

                    <button class="btn btn-login w-100 mt-3">
                        Login
                    </button>

                </form>

                <p class="text-center small text-muted mt-3">
                    Gym Management System - TaibaShaikh
                </p>

            </div>

        </div>

    </div>
</div>

<script>
function togglePass(){
    let p = document.getElementById("pass");
    p.type = p.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
