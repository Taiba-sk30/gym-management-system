{% extends 'base.html' %}
{% block content %}

<a href="/logout" class="btn btn-danger float-end">
    Logout
</a>

<h2 class="mb-4">
    <i class="fa-solid fa-dumbbell"></i> Dashboard
</h2>

<div class="row">

    <div class="col-md-3 mb-4">
        <a href="/trainer" class="text-decoration-none">
        <div class="card p-4 text-center shadow">
            <i class="fa-solid fa-user-tie fa-2x text-danger"></i>
            <h5 class="mt-3">Trainers</h5>
            <h3>{{ trainers }}</h3>
        </div>
        </a>
    </div>

    <div class="col-md-3 mb-4">
        <a href="/trainee" class="text-decoration-none">
        <div class="card p-4 text-center shadow">
            <i class="fa-solid fa-users fa-2x text-success"></i>
            <h5 class="mt-3">Trainees</h5>
            <h3>{{ trainees }}</h3>
        </div>
        </a>
    </div>

    <div class="col-md-3 mb-4">
        <a href="/active-members" class="text-decoration-none">
        <div class="card p-4 text-center shadow">
            <i class="fa-solid fa-circle-check fa-2x text-info"></i>
            <h5 class="mt-3">Active Members</h5>
            <h3>{{ active }}</h3>
        </div>
        </a>
    </div>

    <div class="col-md-3 mb-4">
        <a href="/renewals" class="text-decoration-none">
        <div class="card p-4 text-center shadow">
            <i class="fa-solid fa-bell fa-2x text-warning"></i>
            <h5 class="mt-3">Renewals Due</h5>
            <h3>{{ renewals }}</h3>
        </div>
        </a>
    </div>

</div>


{% endblock %}
