{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">
    <i class="fa-solid fa-comments"></i> Enquiry Management
</h2>

<div class="row">

    <!-- Add Enquiry Form -->
    <div class="col-md-4">
        <div class="card p-4">
            <h5><i class="fa-solid fa-user-plus"></i> Add Enquiry</h5>

            <form method="POST">

                <label class="mt-3">Name</label>
                <input type="text" name="name" class="form-control" required>

                <label class="mt-3">Phone</label>
                <input type="text" name="phone" class="form-control" required>

                <label class="mt-3">Interested In</label>
                <select name="interest" class="form-control">
                    <option>Weight Training</option>
                    <option>Yoga</option>
                    <option>Cardio</option>
                    <option>CrossFit</option>
                </select>

                <label class="mt-3">Status</label>
                <select name="status" class="form-control">
                    <option>New</option>
                    <option>Follow-Up</option>
                    <option>Joined</option>
                </select>

                <button class="btn btn-primary mt-4 w-100">
                    <i class="fa-solid fa-floppy-disk"></i> Save Enquiry
                </button>

            </form>
        </div>
    </div>


    <!-- Enquiry List -->
    <div class="col-md-8">
        <div class="card p-4">
            <h5><i class="fa-solid fa-list"></i> Enquiry List</h5>

            <table class="table table-bordered mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Interested In</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>

                    {% for e in enquiries %}
                    <tr>
                        <td>{{ e.id }}</td>
                        <td>{{ e.name }}</td>
                        <td>{{ e.phone }}</td>
                        <td>{{ e.interest }}</td>
                        <td>
                            <span class="badge 
                                {% if e.status=='Joined' %} bg-success
                                {% elif e.status=='Follow-Up' %} bg-warning text-dark
                                {% else %} bg-secondary
                                {% endif %}
                            ">
                                {{ e.status }}
                            </span>
                        </td>
                    </tr>
                    {% endfor %}

                </tbody>
            </table>
        </div>
    </div>

</div>

{% endblock %}
